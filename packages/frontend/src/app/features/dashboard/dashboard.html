<div class="min-h-screen bg-slate-50">
  <div class="mx-auto max-w-md px-4 py-8 md:max-w-2xl">
    <h1 class="text-2xl font-bold text-slate-900">Versión30</h1>
    <p class="mt-1 text-sm text-slate-500">Sesión iniciada como {{ email }}</p>

    <a
      routerLink="/rutina"
      class="mt-6 flex items-center justify-between rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-colors hover:border-blue-300"
    >
      <span class="flex items-center gap-3">
        <span class="text-2xl" aria-hidden="true">💪</span>
        <span class="font-semibold text-slate-800">Rutina de hoy</span>
      </span>
      <span class="text-slate-400" aria-hidden="true">&rarr;</span>
    </a>

    <a
      routerLink="/comida"
      class="mt-3 flex items-center justify-between rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-colors hover:border-blue-300"
    >
      <span class="flex items-center gap-3">
        <span class="text-2xl" aria-hidden="true">🍽️</span>
        <span class="font-semibold text-slate-800">Comida</span>
      </span>
      <span class="text-slate-400" aria-hidden="true">&rarr;</span>
    </a>

    <a
      routerLink="/peso"
      class="mt-3 flex items-center justify-between rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-colors hover:border-blue-300"
    >
      <span class="flex items-center gap-3">
        <span class="text-2xl" aria-hidden="true">⚖️</span>
        <span class="font-semibold text-slate-800">Peso corporal</span>
      </span>
      <span class="text-slate-400" aria-hidden="true">&rarr;</span>
    </a>

    <a
      routerLink="/actividad"
      class="mt-3 flex items-center justify-between rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-colors hover:border-blue-300"
    >
      <span class="flex items-center gap-3">
        <span class="text-2xl" aria-hidden="true">⌚</span>
        <span class="font-semibold text-slate-800">Actividad (Garmin)</span>
      </span>
      <span class="text-slate-400" aria-hidden="true">&rarr;</span>
    </a>

    <button
      (click)="logout()"
      class="mt-8 w-full rounded-xl border border-slate-200 py-2.5 text-sm font-medium text-slate-500 transition-colors hover:bg-slate-100"
    >
      Cerrar sesión
    </button>
  </div>
</div>
