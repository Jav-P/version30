<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4">
  <form
    class="flex w-full max-w-xs flex-col gap-3"
    (ngSubmit)="submit()"
  >
    <h1 class="text-2xl font-bold text-slate-900">Versión30</h1>
    <p class="-mt-2 mb-2 text-sm text-slate-500">
      {{ mode() === 'signIn' ? 'Inicia sesión' : 'Crea tu cuenta' }}
    </p>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Correo
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="email"
        class="rounded-lg border border-slate-300 px-3 py-2 text-base text-slate-900 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
      />
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Contraseña
      <div class="relative flex">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          autocomplete="current-password"
          class="w-full rounded-lg border border-slate-300 py-2 pl-3 pr-10 text-base text-slate-900 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        />
        <button
          type="button"
          class="absolute right-1 top-1/2 -translate-y-1/2 rounded-md p-1.5 text-slate-500 hover:text-slate-700"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          {{ showPassword() ? '🙈' : '👁️' }}
        </button>
      </div>
    </label>

    @if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="mt-1 rounded-lg bg-blue-600 py-2.5 text-base font-semibold text-white transition-colors disabled:cursor-default disabled:opacity-60"
    >
      {{ loading() ? 'Cargando...' : mode() === 'signIn' ? 'Entrar' : 'Crear cuenta' }}
    </button>

    <button
      type="button"
      class="text-sm text-blue-600"
      (click)="toggleMode()"
    >
      {{ mode() === 'signIn' ? '¿Primera vez? Crear cuenta' : '¿Ya tienes cuenta? Inicia sesión' }}
    </button>
  </form>
</div>
